
services:
  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      DB_HOST: db
    ports:
      - 8081:8081
    depends_on:
      db:
        condition: service_healthy
    
  frontend:
    build: ./frontend
    ports:
      - 3000:3000
    volumes:
      - ./frontend:/usr/src/app
      - /usr/src/app/node_modules
    depends_on:
      - backend
  
  db:
    image: mysql:8
    command: --lower_case_table_names=1
    environment:
      MYSQL_DATABASE: gestaoContas
      MYSQL_ROOT_PASSWORD: ${password}
    volumes:
      - db-data:/var/lib/mysql
      - ./DB/dbContas.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${password}"]
      interval: 5s
      timeout: 5s
      retries: 10
  
volumes:
  db-data:

