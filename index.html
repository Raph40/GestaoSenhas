<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gestor de Contas / Login</title>
    <link rel="stylesheet" href="./estilos/style.css" />
</head>
<body class="bg-slate-900 text-white flex items-center justify-center min-h-screen">
    <div class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-2xl p-8 shadow-2xl">
        <form class="space-y-4">
            <h1 class="text-blue-500 text-2xl font-bold flex justify-center pb-6 uppercase">Login</h1>
            <label class="block text-sm font-medium text-slate-300 mb-1">Email</label>
            <input type="email" id="email" class="py-2.5 sm:py-3 px-4 rounded-lg block w-full bg-layer border border-slate-800 sm:text-sm text-foreground placeholder:text-muted-foreground-1 focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500 disabled:opacity-50 disabled:pointer-events-none transition" placeholder="Digite seu e-mail"/>
            <label class="block text-sm font-medium text-slate-300 mb-1">Senha</label>
            <input type="password" id="password" class="py-2.5 sm:py-3 px-4 rounded-lg block w-full bg-layer border border-slate-800 sm:text-sm text-foreground placeholder:text-muted-foreground-1 focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500 disabled:opacity-50 disabled:pointer-events-none transition" placeholder="Digite a sua senha"/>

            <button type="button" class="w-full py-3 px-4 inline-flex justify-center items-center text-sm font-semibold rounded-lg bg-blue-600 hover:bg-blue-500 text-white shadow-lg shadow-blue-500/20 active:scale-[0.99] focus:outline-none focus:ring-2 focus:ring-blue-400 focus:ring-offset-2 focus:ring-offset-slate-900 transition-all duration-200 cursor-pointer disabled:opacity-50 disabled:pointer-events-none">Entrar</button>
            <button onclick="window.location.href = 'paginasHTML/registar.html'" type="button" class="w-full py-3 px-4 inline-flex justify-center items-center text-sm font-medium rounded-lg border border-slate-700 bg-slate-800/40 text-slate-300 hover:bg-slate-800 hover:text-white hover:border-slate-600 active:scale-[0.99] focus:outline-none focus:ring-2 focus:ring-slate-500 focus:ring-offset-2 focus:ring-offset-slate-900 transition-all duration-200 cursor-pointer disabled:opacity-50 disabled:pointer-events-none">Registar</button>
        </form>
    </div>
</body>
</html>
