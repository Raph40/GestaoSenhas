<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Contas</title>
    <link rel="stylesheet" href="estilos/style.css" />
    <script src="js/paginaContas.js" defer></script>
</head>

<body class="bg-fundo text-slate-200">
    <div class="grid grid-cols-[16rem_1fr] min-h-screen">
        <aside id="sidebarDonos"
            class="sticky top-0 flex h-screen w-64 shrink-0 flex-col border-r border-slate-800 bg-[#0d1629] px-5 py-8 text-slate-400">
            <div id="parteSuperior">
                <h1 class="mb-8 px-3.5 text-[22px] font-medium text-[#2b7fff]">Contas</h1>
                <div id="donos">
                    <h2 class="mb-2 px-3.5 text-xs uppercase text-slate-500">Donos</h2>
                    <ul id="listaDonos" class="flex flex-col gap-1">
                        <li>
                            <button id="contasTodos" type="button" aria-current="true"
                                class="flex w-full items-center gap-2.5 rounded-[10px] bg-[#12264d] px-3.5 py-2.5 text-[15px] text-[#2b7fff] transition-colors">
                                <svg class="h-4 w-4 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                    <rect x="3" y="3" width="7" height="7" rx="1" />
                                    <rect x="14" y="3" width="7" height="7" rx="1" />
                                    <rect x="3" y="14" width="7" height="7" rx="1" />
                                    <rect x="14" y="14" width="7" height="7" rx="1" />
                                </svg>
                                Todos
                                <span class="ml-auto text-[13px]">12</span>
                            </button>
                        </li>
                    </ul>
                    <button id="adicionarDonos" type="button"
                        class="mt-2 flex w-full items-center gap-2.5 rounded-[10px] px-3.5 py-2.5 text-[15px] text-slate-400 transition-colors hover:text-slate-200">
                        <svg class="h-4 w-4 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" aria-hidden="true">
                            <path d="M12 5v14M5 12h14" />
                        </svg>
                        Novo dono
                    </button>
                    <div id="modalDono"
                        class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/60 p-4">
                        <form id="formDono" class="w-full max-w-md rounded-2xl border border-slate-800 bg-cartao p-6">
                            <h2 class="text-xl font-semibold text-blue-500">Novo dono</h2>
                            <p class="mt-1 text-sm text-slate-400">A quem pertencem as contas que vais adicionar?</p>

                            <label for="nomeDono" class="mt-5 block text-sm font-medium text-slate-200">Nome</label>
                            <input id="nomeDono" name="nome" type="text" maxlength="20" required autofocus
                                placeholder="Ex.: Pai, Sara, Empresa" class="mt-1.5 w-full rounded-xl border border-slate-800 bg-fundo px-4 py-3
                                        text-slate-200 focus:border-blue-600 focus:outline-none">
                            <p id="erroDono" role="alert" class="mt-1.5 min-h-5 text-sm text-red-400"></p>

                            <div class="mt-5 flex justify-end gap-3">
                                <button type="button" id="cancelarDono"
                                    class="rounded-xl border border-slate-600 px-5 py-2.5 font-medium text-slate-200">Cancelar</button>
                                <button type="submit" id="criarDono"
                                    class="rounded-xl bg-blue-600 px-5 py-2.5 font-medium text-white hover:bg-blue-500">Criar
                                    dono</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
            <div id="parteInferior" class="mt-auto border-t border-slate-800 px-3.5 pt-5">
                <p id="email" class="mb-3 truncate text-sm text-slate-400"></p>
                <button id="sairConta" type="button"
                    class="flex h-10 w-full items-center justify-center rounded-[10px] border border-slate-600 text-sm font-medium text-slate-200 transition-colors hover:bg-slate-800/50">
                    Sair
                </button>
            </div>
        </aside>
        <main class="p-8">
            <header class="p-6">
                <div class="mx-auto flex max-w-7xl flex-col gap-6 lg:flex-row lg:items-center lg:justify-between">
                    <div>
                        <h1 class="text-2xl font-medium text-slate-200 lg:text-3xl">Todas as contas</h1>
                        <p id="contagemContas" class="mt-1 text-sm text-slate-400">12 contas de 3 donos</p>
                    </div>
                    <div class="flex flex-col gap-3 sm:flex-row sm:items-center">
                        <div class="relative sm:w-72 lg:w-[420px]">
                            <label for="pesquisa" class="sr-only">Pesquisar contas</label>
                            <svg class="pointer-events-none absolute left-4 top-1/2 h-5 w-5 -translate-y-1/2 text-slate-500"
                                xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"
                                stroke-width="2" aria-hidden="true">
                                <circle cx="11" cy="11" r="7" />
                                <path stroke-linecap="round" d="m20 20-3.5-3.5" />
                            </svg>
                            <input id="pesquisa" type="search" placeholder="Pesquisar por serviço" class="h-12 w-full rounded-xl border border-slate-800 bg-[#0d1629] pl-12 pr-4 text-sm
                                        text-slate-200 placeholder-slate-500 outline-none transition
                                        focus:border-blue-600 focus:ring-2 focus:ring-blue-600/20">
                        </div>
                        <button id="botaoAdicionar" type="button" class="flex h-12 items-center justify-center gap-2 rounded-xl bg-blue-600 px-6
                                text-sm font-semibold text-white transition
                                hover:bg-blue-500 active:scale-[0.98]">
                            <svg class="h-5 w-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                                stroke="currentColor" stroke-width="2.5" aria-hidden="true">
                                <path stroke-linecap="round" d="M12 5v14M5 12h14" />
                            </svg>
                            Adicionar conta
                        </button>
                    </div>
            </header>
            <section id="formConta" data-aberto="false" class="grid grid-rows-[0fr] opacity-0 transition-[grid-template-rows,opacity] duration-300 ease-out
                            motion-reduce:transition-none
                            data-[aberto=true]:grid-rows-[1fr] data-[aberto=true]:opacity-100">
                <div class="min-h-0 overflow-hidden">
                    <div class="mx-auto max-w-7xl px-6 pb-6">
                        <form id="formNovaConta" novalidate
                            class="rounded-2xl border border-slate-800 bg-[#111c2e] p-6">
                            <h2 class="mb-6 text-lg font-medium text-slate-200">Nova conta</h2>
                            <div class="grid gap-4 md:grid-cols-4">
                                <div>
                                    <label for="inputEntidade"
                                        class="mb-2 block text-sm font-medium text-slate-200">Entidade</label>
                                    <input id="inputEntidade" name="entidade" type="text" autocomplete="off"
                                        placeholder="Digite a entidade" class="h-12 w-full rounded-xl border border-slate-800 bg-[#0d1629] px-4 text-sm
                                    text-slate-200 placeholder-slate-500 outline-none transition
                                    focus:border-blue-600 focus:ring-2 focus:ring-blue-600/20">
                                </div>
                                <div>
                                    <label for="inputEmail"
                                        class="mb-2 block text-sm font-medium text-slate-200">Email</label>
                                    <input id="inputEmail" name="email" type="email" autocomplete="off"
                                        placeholder="Digite o email da conta" class="h-12 w-full rounded-xl border border-slate-800 bg-[#0d1629] px-4 text-sm
                                    text-slate-200 placeholder-slate-500 outline-none transition
                                    focus:border-blue-600 focus:ring-2 focus:ring-blue-600/20">
                                </div>
                                <div>
                                    <label for="inputSenha"
                                        class="mb-2 block text-sm font-medium text-slate-200">Senha</label>
                                    <input id="inputSenha" name="senha" type="password" autocomplete="new-password"
                                        placeholder="Digite a senha da conta" class="h-12 w-full rounded-xl border border-slate-800 bg-[#0d1629] px-4 text-sm
                                    text-slate-200 placeholder-slate-500 outline-none transition
                                    focus:border-blue-600 focus:ring-2 focus:ring-blue-600/20">
                                </div>
                                <div>
                                    <label for="campoTitular"
                                        class="mb-2 block text-sm font-medium text-slate-200">Titular</label>
                                    <div class="relative">
                                        <select id="campoTitular" name="titular" required class="h-12 w-full appearance-none rounded-xl border border-slate-800 bg-[#0d1629]
                             pl-4 pr-11 text-sm text-slate-200 outline-none transition invalid:text-slate-500
                             focus:border-blue-600 focus:ring-2 focus:ring-blue-600/20">
                                            <option value="" disabled selected>Seleciona o titular</option>
                                        </select>
                                        <svg class="pointer-events-none absolute right-4 top-1/2 h-4 w-4 -translate-y-1/2 text-slate-500"
                                            xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                                            stroke="currentColor" stroke-width="2.5" aria-hidden="true">
                                            <path stroke-linecap="round" stroke-linejoin="round" d="m6 9 6 6 6-6" />
                                        </svg>
                                    </div>
                                </div>
                            </div>
                            <p id="erroForm" role="alert" class="mt-4 hidden text-sm text-red-400"></p>
                            <div class="mt-6 flex justify-end gap-3">
                                <button id="botaoCancelarFormContas" type="button" class="h-12 rounded-xl border border-slate-600 px-6 text-sm font-semibold text-slate-200
                                    transition hover:border-slate-400 hover:bg-slate-800/60">
                                    Cancelar
                                </button>
                                <button id="guardarConta" type="submit" class="h-12 rounded-xl bg-blue-600 px-6 text-sm font-semibold text-white
                                    transition hover:bg-blue-500 active:scale-[0.98]">
                                    Guardar conta
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </section>
            <div class="mx-auto max-w-7xl">
                <!-- Grelha: 1 coluna no telemóvel, 2 em tablet, 3 em ecrãs grandes -->
                <ul id="listaContas" class="grid grid-cols-1 gap-6 md:grid-cols-2 xl:grid-cols-3"></ul>

                <!-- Estado vazio (sem contas ou sem resultados na pesquisa) -->
                <div id="estadoVazio"
                    class="hidden rounded-2xl border border-dashed border-slate-800 p-12 text-center text-sm text-slate-400">
                    Nenhuma conta encontrada.
                </div>
            </div>
        </main>
    </div>
    <!-- Modelo de um card (o JavaScript copia isto para cada conta) -->
    <template id="modeloCard">
        <li class="rounded-2xl border border-slate-800 bg-[#111c2e] p-5 transition hover:border-slate-600">

            <!-- Topo: avatar, email e titular -->
            <div class="mb-4 flex items-center gap-4">
                <div data-campo="inicial"
                    class="flex h-12 w-12 shrink-0 items-center justify-center rounded-xl bg-[#12264d] text-xl font-medium text-blue-500">
                </div>

                <div class="min-w-0 flex-1">
                    <p data-campo="entidade" class="truncate text-lg font-medium text-slate-200"></p>
                    <p data-campo="email" class="truncate text-sm text-slate-400"></p>
                </div>

                <span
                    class="inline-flex shrink-0 items-center gap-2 rounded-full border border-slate-800 px-3 py-1 text-xs text-slate-400">
                    <span data-campo="titular"></span>
                </span>
            </div>

            <!-- Fundo: senha + ações -->
            <div class="flex items-center gap-1 border-t border-slate-800 pt-4 text-slate-400">
                <p data-campo="senha" class="flex-1 truncate font-mono text-sm"></p>

                <button data-campo="ver" type="button" aria-label="Mostrar senha"
                    class="rounded-lg p-2 transition hover:bg-slate-800 hover:text-blue-500">
                    <svg id="iconeVer" class="h-5 w-5" xmlns="http://www.w3.org/2000/svg" fill="none"
                        viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round" aria-hidden="true">
                        <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z" />
                        <circle cx="12" cy="12" r="3" />
                    </svg>
                    <svg id="iconeEsconder" class="hidden h-5 w-5" xmlns="http://www.w3.org/2000/svg"
                        fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round" aria-hidden="true">
                        <path
                            d="M3 3l18 18M10.6 5.1A9.7 9.7 0 0 1 12 5c6.5 0 10 7 10 7a17 17 0 0 1-3.2 4M6.6 6.6C3.7 8.3 2 12 2 12s3.5 7 10 7c1.7 0 3.2-.4 4.5-1M9.9 9.9a3 3 0 0 0 4.2 4.2" />
                    </svg>
                </button>

                <button data-campo="copiar" type="button" aria-label="Copiar senha"
                    class="rounded-lg p-2 transition hover:bg-slate-800 hover:text-blue-500">
                    <svg data-campo="iconeCopiar" class="h-5 w-5" xmlns="http://www.w3.org/2000/svg" fill="none"
                        viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round" aria-hidden="true">
                        <rect x="9" y="9" width="11" height="11" rx="2" />
                        <path d="M5 15V6a2 2 0 0 1 2-2h9" />
                    </svg>
                    <svg data-campo="iconeCopiado" class="hidden h-5 w-5 text-emerald-400"
                        xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"
                        stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="m5 12 5 5 9-9" />
                    </svg>
                </button>
            </div>
        </li>
    </template>
</html>
